<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Anubis Fast fireball with a web globe cutout</title>
  <defs>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf70"/>
      <stop offset=".42" stop-color="#ff8a24"/>
      <stop offset="1" stop-color="#df271f"/>
    </linearGradient>
    <linearGradient id="fire" x1=".7" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffca3a"/>
      <stop offset=".48" stop-color="#ff6b22"/>
      <stop offset="1" stop-color="#d92725"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65d2ff"/>
      <stop offset="1" stop-color="#2365b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globeClip"><circle cx="0" cy="0" r="20"/></clipPath>
  </defs>

  <!-- The flame trail points toward the upper-right. -->
  <g fill="url(#trail)" filter="url(#glow)">
    <path d="M73 52C87 44 96 28 91 10c13 8 22 20 20 33-2 10-10 17-20 21z"/>
    <path d="M82 43c12-10 17-22 14-35 9 8 13 17 10 26-2 7-8 12-15 16z" opacity=".82"/>
    <path d="M68 56c5-13 4-23-2-31 11 6 16 16 13 25-1 5-4 9-8 13z" opacity=".74"/>
  </g>

  <!-- Dense fireball mass, traveling down-left. -->
  <path fill="url(#fire)" d="M57 112c-21 0-36-15-36-36 0-15 8-27 20-37-2 12 4 18 11 17 8-1 10-10 8-20 16 9 22 21 18 32 8-5 13-1 13 7 0 21-15 37-34 37z"/>
  <path fill="#ffe27a" d="M58 105c-11 0-20-8-20-19 0-6 3-12 8-17-1 8 3 11 7 10 5-1 6-6 5-11 9 5 13 12 11 19 5-3 8 0 8 5 0 8-8 13-19 13z"/>

  <!-- WWW globe cutout, centered on the fireball body rather than the trail. -->
  <g transform="translate(55 78)">
    <circle r="22" fill="#13273b" stroke="#ffe27a" stroke-width="2"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="url(#globe)" stroke-width="2.4">
      <ellipse rx="9" ry="20"/>
      <ellipse rx="20" ry="9"/>
      <path d="M-20 0h40M0-20v40"/>
    </g>
    <circle r="20" fill="none" stroke="#8be1ff" stroke-width="1" opacity=".75"/>
  </g>
</svg>
