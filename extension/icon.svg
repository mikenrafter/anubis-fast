<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Anubis Fast fireball with globe cutout</title>
  <defs>
    <linearGradient id="fire" x1=".7" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffd95a"/>
      <stop offset=".48" stop-color="#ff7b21"/>
      <stop offset="1" stop-color="#d92725"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79dcff"/>
      <stop offset="1" stop-color="#2772c4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flame-front-clip">
      <path d="M52 78L76 50L94 67L78 84Z"/>
    </clipPath>
  </defs>
